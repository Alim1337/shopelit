name: Keep Supabase awake

# Supabase pauses free projects that don't get "a few user requests to the
# database each day" over a week. The old schedule (once every 3 days) was
# below that, so the project got paused. This runs 4x a day and hits the DB
# through two independent paths, so one failing doesn't let it go idle.

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (00:17, 06:17, 12:17, 18:17 UTC)
  workflow_dispatch:          # run manually from the Actions tab

permissions:
  actions: write   # needed only to re-enable this workflow (see last step)
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Path 1: through the live site (Vercel -> Supabase). Real queries.
      - name: Ping site endpoints
        id: site
        continue-on-error: true
        run: |
          set -e
          base="https://shopelit.vercel.app"
          for path in /api/health /api/categories; do
            echo "GET $path"
            body=$(curl -sS --fail --retry 3 --retry-delay 15 --retry-all-errors -m 30 "$base$path")
            echo "$body" | head -c 200; echo
            echo "$body" | grep -Eq '"(ok|success)":true'
          done

      # Path 2: straight to the database, independent of Vercel.
      # Add the secret SUPABASE_DB_URL (Session pooler URL, port 5432) in
      # Settings -> Secrets and variables -> Actions. Skipped if not set.
      - name: Query database directly
        id: db
        continue-on-error: true
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "SUPABASE_DB_URL secret not set, skipping direct ping."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for i in 1 2 3; do
            if psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -tAc \
                 "select count(*) from categories; select now();"; then
              exit 0
            fi
            echo "Attempt $i failed, retrying in 20s..."; sleep 20
          done
          exit 1

      # GitHub disables scheduled workflows after 60 days without repo
      # activity. Re-enabling via the API resets that, so this never stops.
      - name: Keep this workflow enabled
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wf="${GITHUB_WORKFLOW_REF%%@*}"; wf="${wf##*/}"
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable"

      # Fail the run (GitHub emails you) if the database wasn't reached.
      - name: Check result
        if: steps.site.outcome == 'failure' && (steps.db.outcome == 'failure' || steps.db.outputs.skipped == 'true')
        run: |
          echo "::error::Supabase could not be reached. If it is paused, open the Supabase dashboard and click 'Resume project'."
          exit 1
